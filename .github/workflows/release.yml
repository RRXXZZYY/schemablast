name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack
      - run: node dist/cli.js demo --out schemablast-demo.html
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            schemablast-*.tgz
            schemablast-demo.html
